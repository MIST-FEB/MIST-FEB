  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-image: url('img/Mist Through The Year Background.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center top;
      color: #fff;
      text-align: center;
      overflow-x: hidden;
      font-size: 30px;
    }


    h1 {
      font-size: 3em;
      margin-top: 40px;
      background: linear-gradient(90deg, #FFC739 3%, #FFFFFF 50%, #FFC739 100%);
      -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text; /* for Firefox */
  color: transparent;    /* fallback */
    }

    h2{
        background: linear-gradient(90deg, #FFC739 3%, #FFFFFF 50%, #FFC739 100%);
        -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text; /* for Firefox */
  color: transparent;    /* fallback */
    }

    /* Carousel for past documentation */
    .carousel-wrapper {
  overflow-x: auto;
  white-space: nowrap;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  margin: 10px auto;
  max-width: 960px;
  width: 960px;
  box-sizing: border-box;
}

.carousel-slide {
  display: inline-block;
  scroll-snap-align: start;
  width: 960px;
  box-sizing: border-box;
}

@media (max-width: 980px) {
  .carousel-wrapper,
  .carousel-slide {
    width: 90vw;
    max-width: 100%;
  }
}


    .slide-grid {
      display: grid;
      grid-template-columns: repeat(3, 300px);
      grid-gap: 15px;
      justify-items: center;
    }

    .slide-grid img {
  width: 75%;
  aspect-ratio: 4 / 3; /* slightly rectangular, not square */
  object-fit: cover; /* fills shape without distortion */
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  border: 4px solid #FFC739;/* yellow border */
  margin: 0 auto;
}

    .media-title {
      font-size: 2em;
      font-weight: bold;
      margin-top: 55vh;
      color: #fff;

    }

    /* Partner sections aligned to background stripes */
    .partner-title {
      font-size: 2em;
      font-weight: bold;
      margin-top: 20vh;
      color: #fff;

    }

    .partner-section {
      height: 120px; /* aligns with middle gray bar */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .media-section {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .rolling-container {
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .rolling-track {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
    }

    .rolling-track img {
      height: 80px;
      margin: 0 40px;
      object-fit: contain;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @media (max-width: 768px) {
      .slide-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .slide-grid img {
        height: 150px;
      }

      .rolling-track img {
        height: 50px;
        margin: 0 20px;
      }
    }
  </style>
